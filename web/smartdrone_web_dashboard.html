<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartDrone</title>
<style>
:root{--bg:#f2f6fb;--panel:#ffffff;--line:#d8e1ee;--tx:#14213d;--mu:#56668a;--ac:#0b7285;--ok:#15803d;--wa:#b45309;--er:#b91c1c}
*{box-sizing:border-box}
body{margin:0;font:17px/1.55 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx)}
h1,h2,h3{margin:0;font-weight:600}
small{color:var(--mu);font-size:.88em}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.center{min-height:100vh;display:grid;place-items:center;padding:16px}
.login{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:28px}
.login h1{font-size:30px;margin-bottom:4px}
.login p{margin:0 0 20px;color:var(--mu)}
label{display:block;margin:14px 0 5px;color:var(--mu);font-size:15px}
input,select{width:100%;padding:11px 13px;background:#fff;border:1px solid var(--line);border-radius:6px}
.go{width:100%;margin-top:18px;padding:10px;border:0;border-radius:6px;background:var(--ac);color:#fff;font-weight:600;font-size:17px;cursor:pointer}
.demo{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.demo button{padding:4px 9px;border:1px solid var(--line);background:transparent;border-radius:16px;color:var(--mu);cursor:pointer;font-size:15px}
.err{color:var(--er);min-height:22px;margin:10px 0 0;font-size:15px}
header{display:flex;align-items:center;gap:16px;padding:12px 24px;border-bottom:1px solid var(--line)}
header h2{font-size:23px;margin-right:auto}
header,nav{background:var(--panel)}
#who b{display:block;line-height:1.2}
#who small{display:block}
.out{padding:8px 15px;font-size:15px;border:1px solid var(--line);background:transparent;border-radius:6px;cursor:pointer}
nav{display:flex;gap:4px;padding:0 24px;border-bottom:1px solid var(--line)}
nav button{padding:14px 18px;font-size:16px;border:0;border-bottom:2px solid transparent;background:none;color:var(--mu);cursor:pointer}
nav button.on{color:var(--tx);border-bottom-color:var(--ac)}
main{padding:24px;max-width:1200px;margin:0 auto}
.stats{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;margin-bottom:20px;background:var(--panel)}
.stat{flex:1 1 150px;padding:16px 18px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-size:34px;line-height:1.2}
.stat span{color:var(--mu);font-size:15px}
.ok{color:var(--ok)}.wa{color:var(--wa)}.er{color:var(--er)}.ac{color:var(--ac)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:800px){.two{grid-template-columns:1fr}header,nav,main{padding-left:14px;padding-right:14px}}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
section h3{margin-bottom:14px;font-size:20px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--mu);font-weight:600;font-size:15px;padding:8px 12px;border-bottom:1px solid var(--line)}
td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.bar{display:grid;grid-template-columns:190px 1fr 34px;align-items:center;gap:10px;margin:8px 0}
.bar i{display:block;height:8px;border-radius:4px;background:var(--ac)}
.bar b{text-align:right}
.chip{display:inline-block;padding:3px 12px;border-radius:14px;font-size:15px;font-weight:600;border:1px solid var(--line)}
.Pending,.Busy{color:var(--wa);border-color:var(--wa)}
.Approved,.Scheduled,.InTransit{color:var(--ac);border-color:var(--ac)}
.Completed,.Available{color:var(--ok);border-color:var(--ok)}
.Rejected,.Failed,.Maintenance{color:var(--er);border-color:var(--er)}
.b{margin:2px 4px 2px 0;padding:8px 14px;border-radius:7px;border:1px solid;background:transparent;cursor:pointer;font-size:16px;font-weight:600}
.b.ok{color:var(--ok)}.b.er{color:var(--er)}.b.ac{color:var(--ac)}
td input{width:120px;padding:8px 10px;margin-right:4px}
#toast{position:fixed;right:20px;bottom:20px;padding:12px 18px;font-size:16px;border-radius:8px;background:var(--ok);color:#fff;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.bad{background:var(--er)}
#toast.show{opacity:1}
.empty{color:var(--mu);padding:20px 0;text-align:center}
.map{display:block;width:100%;height:auto;margin:8px 0 16px;background:#eaf1f9;border:1px solid var(--line);border-radius:8px}
.map text{fill:var(--tx);font-size:15px;font-weight:600}
.dr{transition:transform 2s linear}
</style>
</head>
<body>

<div id="login" class="center">
  <form class="login" onsubmit="login(event)">
    <h1>SmartDrone</h1>
    <p>Đăng nhập để quản lý đơn giao hàng bằng drone</p>
    <label for="em">Email</label>
    <input id="em" type="email" autocomplete="username" required>
    <label for="pw">Mật khẩu</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="go">Đăng nhập</button>
    <div id="err" class="err" role="alert"></div>
    <div class="demo" id="demo"></div>
  </form>
</div>

<div id="app" hidden>
  <header>
    <h2>SmartDrone</h2>
    <div id="who"></div>
    <button class="out" onclick="logout()">Đăng xuất</button>
  </header>
  <nav id="tabs"></nav>
  <main id="view"></main>
</div>
<div id="toast" role="status"></div>

<script>
const API = 'http://localhost:5139';
const S = { token: null, user: null, tab: '', stations: {}, stationList: [], tick: 0, timer: null };
const $ = s => document.querySelector(s);

const STATUS = { Pending: 'Chờ duyệt', Approved: 'Đã duyệt', Rejected: 'Từ chối', Scheduled: 'Đã xếp lịch',
  InTransit: 'Đang giao', Completed: 'Hoàn tất', Failed: 'Thất bại',
  Available: 'Sẵn sàng', Busy: 'Đang bận', Maintenance: 'Bảo trì',Cancelled: 'Đã hủy' };
const ROLE = { Customer: 'Khách hàng', Dispatcher: 'Điều phối viên', StationOperator: 'Nhân viên trạm',
  LogisticsManager: 'Quản lý logistics', SystemAdmin: 'Quản trị viên' };
const DEMO = [['Điều phối viên', 'dispatcher@smartdrone.vn'], ['Nhân viên trạm', 'operator@smartdrone.vn'],
  ['Quản lý', 'manager@smartdrone.vn'], ['Quản trị', 'admin@smartdrone.vn'], ['Khách hàng', 'khachhang1@gmail.com']];

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = n => Number(n || 0).toLocaleString('vi-VN');
const dtime = s => s ? new Date(s).toLocaleString('vi-VN') : '';
const dday = s => s ? new Date(s).toLocaleDateString('vi-VN') : '';
const chip = s => `<span class="chip ${esc(s)}">${esc(STATUS[s] || s)}</span>`;
const stn = id => S.stations[id] || ('Trạm ' + id);

async function api(path, opt = {}) {
  const res = await fetch(API + path, {
    method: opt.method || 'GET',
    headers: { 'Content-Type': 'application/json', ...(S.token ? { Authorization: 'Bearer ' + S.token } : {}) },
    body: opt.body ? JSON.stringify(opt.body) : undefined
  });
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (res.status === 401 && S.token) { logout(); throw new Error('Phiên đăng nhập đã hết hạn. Hãy đăng nhập lại.'); }
  if (res.status === 403) throw new Error('Tài khoản này không có quyền thực hiện thao tác này.');
  if (!res.ok) throw new Error((data && (data.message || data.error)) || ('Lỗi ' + res.status));
  return data;
}

function toast(msg, bad) {
  const t = $('#toast');
  t.textContent = msg; t.className = (bad ? 'bad ' : '') + 'show';
  setTimeout(() => t.className = bad ? 'bad' : '', 2800);
}

/* ---------- Đăng nhập ---------- */
$('#demo').innerHTML = DEMO.map(([n, e]) => `<button type="button" onclick="fill('${e}')">${n}</button>`).join('');
function fill(email) { $('#em').value = email; $('#pw').value = '123456'; }

async function login(ev) {
  ev.preventDefault();
  $('#err').textContent = '';
  try {
    const d = await api('/api/Auth/login', { method: 'POST', body: { email: $('#em').value.trim(), password: $('#pw').value } });
    S.token = d.token; S.user = d;
    try { localStorage.setItem('sd', JSON.stringify(d)); } catch (e) {}
    start();
  } catch (e) {
    $('#err').textContent = e.message === 'Failed to fetch'
      ? 'Không kết nối được backend. Hãy chạy backend ở cổng 5139.' : e.message;
  }
}

function logout() {
  clearInterval(S.timer);
  S.token = S.user = null;
  try { localStorage.removeItem('sd'); } catch (e) {}
  $('#app').hidden = true; $('#login').hidden = false;
}

/* ---------- Khung ứng dụng ---------- */
function tabsFor(role) {
  if (role === 'Customer') return { orders: 'Đơn của tôi', create: 'Tạo đơn' };
  if (role === 'StationOperator') return { orders: 'Đơn hàng', map: 'Bản đồ', stations: 'Trạm' };
  return { dash: 'Tổng quan', map: 'Bản đồ', orders: 'Đơn hàng', stations: 'Trạm' };
}

async function start() {
  $('#login').hidden = true; $('#app').hidden = false;
  $('#who').innerHTML = `<b>${esc(S.user.fullName)}</b><small>${esc(ROLE[S.user.role] || S.user.role)}</small>`;
  const tabs = tabsFor(S.user.role);
  $('#tabs').innerHTML = Object.entries(tabs).map(([k, v]) => `<button data-k="${k}" onclick="go('${k}')">${v}</button>`).join('');
  try {
    const list = await api('/api/Stations');
    list.forEach(s => { S.stations[s.id ?? s.stationId] = s.stationName ?? s.name; });
    S.stationList = list
      .map(s => ({ name: s.stationName ?? s.name, lat: s.latitude ?? s.lat, lng: s.longitude ?? s.lng }))
      .filter(s => s.lat != null && s.lng != null);
  } catch (e) {}
  go(Object.keys(tabs)[0]);
  clearInterval(S.timer);
  S.timer = setInterval(() => {
    S.tick++;
    if (S.tab === 'map' || S.tick % 3 === 0) { if (document.activeElement.tagName !== 'INPUT') refresh(); }
  }, 2000);
}

function go(k) {
  S.tab = k;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.k === k));
  refresh();
}

async function refresh() {
  const view = $('#view');
  try {
    if (S.tab === 'create' && $('#cform')) return;
    if (S.tab === 'map') await mapRefresh();
    else view.innerHTML = await VIEW[S.tab]();
  }
  catch (e) { view.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}

/* ---------- Các màn hình ---------- */
const stat = (label, val, cls = '') => `<div class="stat"><b class="${cls}">${val}</b><span>${label}</span></div>`;

const VIEW = {
  async dash() {
    const [a, b, c] = await Promise.all([api('/api/Dashboard/by-status'), api('/api/Dashboard/by-day'), api('/api/Dashboard/by-station')]);
    const n = k => (a.find(x => x.trangThai === k) || {}).tongSoDon || 0;
    const total = a.reduce((s, x) => s + x.tongSoDon, 0);
    const revenue = a.reduce((s, x) => s + Number(x.doanhThuDonThanhCong || 0), 0);
    const max = Math.max(1, ...c.map(x => x.soLuongDonGui));
    return `<div class="stats">
        ${stat('Tổng số đơn', total)}${stat('Chờ duyệt', n('Pending'), 'wa')}${stat('Đang giao', n('InTransit'), 'ac')}
        ${stat('Hoàn tất', n('Completed'), 'ok')}${stat('Thất bại', n('Failed'), 'er')}
        ${stat('Doanh thu đơn hoàn tất (đ)', fmt(revenue), 'ok')}
      </div>
      <div class="two">
        <section><h3>Đơn gửi đi theo trạm</h3>
          ${c.map(x => `<div class="bar"><span>${esc(x.tenTram)}</span><i style="width:${x.soLuongDonGui / max * 100}%"></i><b>${x.soLuongDonGui}</b></div>`).join('') || '<p class="empty">Chưa có dữ liệu.</p>'}
        </section>
        <section><h3>Theo ngày</h3><div class="wrap"><table>
          <tr><th>Ngày</th><th>Số đơn</th><th>Phí giao</th><th>Doanh thu</th></tr>
          ${b.slice(0, 7).map(x => `<tr><td>${dday(x.ngay)}</td><td>${x.tongSoDonTrongNgay}</td><td>${fmt(x.tongPhiGiaoHang)}</td><td>${fmt(x.doanhThuDonThanhCong)}</td></tr>`).join('')}
        </table></div></section>
      </div>`;
  },

  async orders() {
    const mine = S.user.role === 'Customer';
    const raw = await api(mine ? '/api/Orders/mine' : '/api/Orders');
    const list = raw.map(o => mine
      ? { id: o.maDon, code: o.maVanDon, recv: o.tenNguoiNhan, addr: o.diaChiGiao, w: o.khoiLuongKg, fee: o.phiGiaoHang, status: o.trangThai, at: o.ngayTao, eta: o.thoiGianDuKienPhut, otp: o.maOtp }
      : { id: o.id, code: o.trackingCode, recv: o.receiverName, addr: o.receiverAddress, w: o.packageWeightKg, fee: o.deliveryFee, status: o.status, at: o.createdAt, route: stn(o.pickupStationId) + ' → ' + stn(o.dropoffStationId) });
    if (!list.length) return '<section><p class="empty">Chưa có đơn hàng nào.</p></section>';
    const rows = list.map(o => `<tr>
        <td><b>${esc(o.code)}</b><br><small>${dtime(o.at)}</small></td>
        <td>${esc(o.recv)}<br><small>${esc(o.addr)}</small></td>
        <td>${o.route ? esc(o.route) : (o.eta != null ? 'Dự kiến ' + o.eta + ' phút' : '')}</td>
        <td>${o.w} kg<br><small>${fmt(o.fee)} đ</small></td>
        <td>${chip(o.status)}${mine && o.otp && o.status !== 'Completed' ? `<br><small>Mã OTP: <b>${esc(o.otp)}</b></small>` : ''}</td>
        ${mine ? '' : `<td>${actions(o)}</td>`}</tr>`).join('');
    return `<section><div class="wrap"><table>
      <tr><th>Mã vận đơn</th><th>Người nhận</th><th>${mine ? 'Thời gian' : 'Tuyến'}</th><th>Hàng</th><th>Trạng thái</th>${mine ? '' : '<th>Thao tác</th>'}</tr>
      ${rows}</table></div></section>`;
  },

  async stations() {
    const list = await api('/api/Stations');
    return `<section><div class="wrap"><table>
      <tr><th>Trạm</th><th>Địa chỉ</th><th>Trạng thái</th><th>Tọa độ</th></tr>
      ${list.map(s => `<tr><td>${esc(s.stationName ?? s.name)}</td><td>${esc(s.locationAddress ?? s.address ?? '')}</td>
        <td>${chip(s.status)}</td><td><small>${s.latitude}, ${s.longitude}</small></td></tr>`).join('')}
      </table></div></section>`;
  }
};

/* ---------- Khách hàng tạo đơn ---------- */
VIEW.create = async function () {
  const opts = Object.entries(S.stations).map(([id, n]) => `<option value="${esc(id)}">${esc(n)}</option>`).join('');
  return `<section><h3>Tạo đơn giao hàng</h3>
    <form id="cform" onsubmit="submitOrder(event)" style="max-width:480px">
      <label for="c_from">Trạm gửi</label>
      <select id="c_from" required><option value="">Chọn trạm gửi</option>${opts}</select>
      <label for="c_to">Trạm nhận</label>
      <select id="c_to" required><option value="">Chọn trạm nhận</option>${opts}</select>
      <label for="c_name">Tên người nhận</label><input id="c_name" required>
      <label for="c_phone">Số điện thoại người nhận</label><input id="c_phone" inputmode="tel" required>
      <label for="c_addr">Địa chỉ nhận</label><input id="c_addr" required>
      <label for="c_w">Khối lượng (kg, tối đa 5)</label>
      <input id="c_w" type="number" step="0.1" min="0.1" max="5" value="1" required>
      <button class="go">Tạo đơn</button>
      <div id="cmsg" class="err" role="alert"></div>
    </form></section>`;
};

async function submitOrder(ev) {
  ev.preventDefault();
  const msg = $('#cmsg');
  msg.textContent = '';
  try {
    const d = await api('/api/SmartDroneOrder/create', {
      method: 'POST',
      body: {
        pickupStationId: +$('#c_from').value, dropoffStationId: +$('#c_to').value,
        receiverName: $('#c_name').value.trim(), receiverPhone: $('#c_phone').value.trim(),
        receiverAddress: $('#c_addr').value.trim(), packageWeightKg: parseFloat($('#c_w').value)
      }
    });
    toast(`Đã tạo đơn ${d.trackingCode}: phí ${fmt(d.deliveryFee)} đ, dự kiến ${d.estimatedMinutes} phút.`);
    go('orders');
  } catch (e) { msg.textContent = e.message; }
}

/* ---------- Bản đồ giám sát (SVG, chạy được khi không có mạng) ---------- */
function projector(points) {
  const W = 800, H = 460, pad = 80;
  const lats = points.map(p => p.lat), lngs = points.map(p => p.lng);
  const minLat = Math.min(...lats), minLng = Math.min(...lngs);
  const dLat = (Math.max(...lats) - minLat) || 0.01, dLng = (Math.max(...lngs) - minLng) || 0.01;
  const sc = Math.min((W - 2 * pad) / dLng, (H - 2 * pad) / dLat);
  const ox = (W - dLng * sc) / 2, oy = (H - dLat * sc) / 2;
  return (lat, lng) => [ox + (lng - minLng) * sc, H - (oy + (lat - minLat) * sc)];
}

async function mapRefresh() {
  if (!$('#mapsvg')) {
    $('#view').innerHTML = `<section><h3>Bản đồ giám sát</h3>
      <svg id="mapsvg" class="map" viewBox="0 0 800 460" role="img" aria-label="Các trạm và drone đang bay">
        <g id="lines"></g><g id="stn"></g><g id="drones"></g></svg>
      <div id="maplist" class="wrap"></div></section>`;
  }
  const flights = await api('/api/Flights');
  const pts = [...S.stationList];
  flights.forEach(f => pts.push(f.origin, f.destination));
  if (!pts.length) { $('#maplist').innerHTML = '<p class="empty">Chưa có dữ liệu tọa độ của các trạm.</p>'; return; }
  const P = projector(pts);

  $('#lines').innerHTML = flights.map(f => {
    const a = P(f.origin.lat, f.origin.lng), b = P(f.destination.lat, f.destination.lng);
    return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#0b7285" stroke-width="3" stroke-dasharray="8 8" opacity=".7"/>`;
  }).join('');

  $('#stn').innerHTML = S.stationList.map(s => {
    const p = P(s.lat, s.lng);
    return `<circle cx="${p[0]}" cy="${p[1]}" r="11" fill="#ffffff" stroke="#14213d" stroke-width="3"/>
            <text x="${p[0]}" y="${p[1] - 16}" text-anchor="middle">${esc(s.name)}</text>`;
  }).join('');

  const layer = $('#drones'), live = new Set();
  flights.forEach(f => {
    const id = 'dr' + f.orderId, [x, y] = P(f.lat, f.lng);
    live.add(id);
    let g = document.getElementById(id);
    if (!g) {
      g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.id = id; g.setAttribute('class', 'dr');
      g.style.transform = `translate(${x}px,${y}px)`;
      g.innerHTML = '<circle r="8" fill="#d97706"/><path d="M-14 -14L14 14M14 -14L-14 14" stroke="#d97706" stroke-width="4" stroke-linecap="round"/><text y="28" text-anchor="middle"></text>';
      layer.appendChild(g);
    }
    g.querySelector('text').textContent = f.trackingCode;
    requestAnimationFrame(() => { g.style.transform = `translate(${x}px,${y}px)`; });
  });
  [...layer.children].forEach(g => { if (!live.has(g.id)) g.remove(); });

  $('#maplist').innerHTML = flights.length
    ? `<table><tr><th>Mã vận đơn</th><th>Tuyến</th><th>Tiến độ</th><th>Ghi chú</th></tr>${flights.map(f => `<tr>
        <td><b>${esc(f.trackingCode)}</b></td>
        <td>${esc(f.origin.name)} → ${esc(f.destination.name)}</td>
        <td>${Math.round(f.progress * 100)}%</td>
        <td>${f.arrived ? 'Đã tới trạm nhận, chờ nhân viên nhập OTP' : 'Còn khoảng ' + f.remainingSeconds + ' giây'}</td></tr>`).join('')}</table>`
    : '<p class="empty">Hiện không có drone nào đang bay.</p>';
}

/* ---------- Thao tác trên đơn ---------- */
const btn = (id, kind, text, cls) => `<button class="b ${cls}" onclick="act(${id},'${kind}')">${text}</button>`;

function actions(o) {
  const r = S.user.role;
  const review = ['Dispatcher', 'SystemAdmin'].includes(r);
  const run = ['Dispatcher', 'StationOperator', 'SystemAdmin'].includes(r);
  const otp = ['StationOperator', 'SystemAdmin'].includes(r);
  let h = btn(o.id, 'summary', 'Tóm tắt AI', 'ac');
  if (o.status === 'Pending' && review) h += btn(o.id, 'approve', 'Duyệt đơn', 'ok') + btn(o.id, 'reject', 'Từ chối', 'er');
  if (['Approved', 'Scheduled'].includes(o.status) && run) h += btn(o.id, 'start', 'Bắt đầu giao', 'ac');
  if (o.status === 'InTransit') {
    if (otp) h += `<input id="otp${o.id}" inputmode="numeric" maxlength="6" placeholder="Mã OTP" aria-label="Mã OTP của đơn ${esc(o.code)}">` + btn(o.id, 'otp', 'Xác nhận giao', 'ok');
    if (run) h += btn(o.id, 'fail', 'Giao thất bại', 'er');
  }
  return h || '<small>Không có thao tác</small>';
}

async function act(id, kind) {
  try {
        if (kind === 'summary') {
      const d = await api(`/api/SmartDroneOrder/${id}/summary`);
      return alert(d.summary + (d.source === 'fallback' ? '\n\n(AI service chưa bật, đang dùng bản dự phòng)' : ''));
    }

    if (kind === 'otp') {
      const code = ($('#otp' + id).value || '').trim();
      if (!code) return toast('Hãy nhập mã OTP khách hàng đọc.', true);
      await api(`/api/SmartDroneOrder/${id}/confirm-delivery`, { method: 'POST', body: { otpCode: code } });
    } else {
      await api(`/api/orders/${id}/${kind}`, { method: 'POST' });
    }
    toast('Đã cập nhật đơn hàng.');
    refresh();
  } catch (e) { toast(e.message, true); }
}

/* ---------- Khởi động ---------- */
try {
  const saved = JSON.parse(localStorage.getItem('sd') || 'null');
  if (saved && saved.token) { S.token = saved.token; S.user = saved; start(); }
} catch (e) {}
</script>
